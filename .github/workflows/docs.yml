name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "service_docs/**"
      - "mkdocs.service.yml"
      - "scripts/build_service_docs.py"
      - "scripts/build_admin_skill.py"
      - "umeko/**"
      - "scripts/generate_api_docs.py"
      - "requirements-docs.txt"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "service_docs/**"
      - "mkdocs.service.yml"
      - "scripts/build_service_docs.py"
      - "scripts/build_admin_skill.py"
      - "umeko/**"
      - "scripts/generate_api_docs.py"
      - "requirements-docs.txt"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation and API dependencies
        run: python -m pip install -r requirements-docs.txt ".[server]"
      - name: Check generated API reference
        run: python scripts/generate_api_docs.py --check
      - name: Install native archive backend
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
      - name: Check downloadable admin Skill
        run: python scripts/build_admin_skill.py --check
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Check bundled service handbook
        run: python scripts/build_service_docs.py --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
