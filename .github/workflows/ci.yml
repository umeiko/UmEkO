name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q
        env:
          PYTHONUTF8: "1"

  build-windows-exe:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build single-file server exe
        run: pyinstaller umeko.spec --noconfirm

      - name: Smoke test (python entry, same code path as exe)
        shell: pwsh
        run: |
          $env:HTTP_PROXY = ""; $env:HTTPS_PROXY = ""; $env:NO_PROXY = "*"
          $env:PYTHONUTF8 = "1"
          # 直接在 shell 里后台启动：输出直接进 console 日志，可见失败原因
          $env:UMEKO_ADMIN_PASSWORD = "ci-admin-pw"
          python -m umeko.server --port 8899 --no-admin 2>&1 | Tee-Object -FilePath smoke-py.log &
          $proc = $null
          Start-Sleep -Seconds 5
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8899/health" -UseBasicParsing -TimeoutSec 3 -NoProxy
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { Write-Host "attempt ${i}: $($_.Exception.Message)" }
          }
          Get-Process | Where-Object {$_.Name -like "*python*"} | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "=== server log ==="; Get-Content smoke-py.log -ErrorAction SilentlyContinue
            throw "smoke test failed: /health not reachable"
          }
          Write-Host "Smoke test passed (python entry; exe verified locally per release notes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: umeko-server-windows
          path: dist/umeko-server.exe
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/umeko-server.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
