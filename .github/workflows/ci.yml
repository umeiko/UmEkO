name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install NGINX and native archive backend
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx 7zip

      - name: Run tests
        run: pytest tests/ -q
        env:
          PYTHONUTF8: "1"
          UMEKO_TEST_NGINX: /usr/sbin/nginx
          UMEKO_TEST_REQUIRE_7ZIP: "1"

      - name: Build and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
          git diff --exit-code -- ../umeko/server/static/ui

      - name: Install browser dependencies
        timeout-minutes: 10
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser workflow checks
        timeout-minutes: 5
        working-directory: frontend
        run: npm run test:smoke
        env:
          UMEKO_TEST_NGINX: /usr/sbin/nginx

  build-windows-exe:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build single-file server exe
        run: pyinstaller umeko.spec --noconfirm

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:HTTP_PROXY = ""; $env:HTTPS_PROXY = ""; $env:NO_PROXY = "*"
          $env:PYTHONUTF8 = "1"
          # exe 后台启动，输出重定向（绝对路径）进日志
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item dist/umeko-server.exe smoke/
          $proc = Start-Process -FilePath "smoke/umeko-server.exe" `
            -ArgumentList "--port","8899","--no-admin" -PassThru -NoNewWindow `
            -RedirectStandardOutput "$PWD/smoke/out.log" -RedirectStandardError "$PWD/smoke/err.log"
          Start-Sleep -Seconds 5
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8899/health" -UseBasicParsing -TimeoutSec 3 -NoProxy
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { Write-Host "attempt ${i}: $($_.Exception.Message)" }
          }
          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Host "=== exe stdout ==="; Get-Content smoke/out.log -ErrorAction SilentlyContinue
            Write-Host "=== exe stderr ==="; Get-Content smoke/err.log -ErrorAction SilentlyContinue
            throw "exe smoke test failed: /health not reachable"
          }
          Write-Host "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: umeko-server-windows
          path: dist/umeko-server.exe
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/umeko-server.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
