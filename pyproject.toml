[project]
name = "umeko"
version = "0.1.0"
description = "UMEKO — Unified Multi-agent Execution Kernel & Orchestrator（统一多智能体执行内核与编排器）：通用 Agent 基座"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
umeko = "umeko.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umeko"]
