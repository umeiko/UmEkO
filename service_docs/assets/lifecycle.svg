<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="机器任务与临时节点生命周期">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#12858a"/></marker></defs>
<rect width="1100" height="420" rx="20" fill="#f3f9f9"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
<text x="550" y="43" fill="#173e49" font-size="24" font-weight="700">执行结束，不等于节点立即消失</text>
<g fill="#fff" stroke="#a9cfd3" stroke-width="2"><rect x="40" y="82" width="190" height="72" rx="12"/><rect x="285" y="82" width="200" height="72" rx="12"/><rect x="540" y="82" width="205" height="72" rx="12"/><rect x="800" y="82" width="260" height="72" rx="12"/></g>
<g font-size="19" fill="#173e49"><text x="135" y="113">提交 / queued</text><text x="385" y="113">初始化 / running</text><text x="642" y="113">提交结果 / 终态</text><text x="930" y="113">闲置计时与回收</text></g>
<g font-size="13" fill="#5b7880"><text x="135" y="138">取得 Task ID 和工作台链接</text><text x="385" y="138">创建 Session 与首个 Run</text><text x="642" y="138">结果文字与交付文件清单</text><text x="930" y="138">活跃执行期间不按闲置回收</text></g>
<g stroke="#12858a" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M232 118h42"/><path d="M487 118h42"/><path d="M747 118h42"/><path d="M925 157v39H300v27"/><path d="M925 157v66"/></g>
<rect x="80" y="235" width="440" height="83" rx="12" fill="#e1f2f2" stroke="#8dc9cb"/><rect x="580" y="235" width="440" height="83" rx="12" fill="#e1f2f2" stroke="#8dc9cb"/>
<g font-size="20" fill="#146c75" font-weight="700"><text x="300" y="269">始终只用机器接口：闲置 15 分钟</text><text x="800" y="269">已打开临时网页：闲置 1 小时</text></g>
<g font-size="14" fill="#446e77"><text x="300" y="296">任务结束后开始计时，到期清理节点文件</text><text x="800" y="296">实际交互续期；续聊是同一 Session 的新 Run</text></g>
<text x="550" y="365" fill="#173e49" font-size="19">默认保留 24 小时：调用记录、结果文字、消息、工具记录和文件树快照</text>
<text x="550" y="395" fill="#5b7880" font-size="14">实际时间以管理员配置和节点到期字段为准；文件树快照不是文件备份</text>
</g></svg>
